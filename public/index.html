<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&lt;ter&gt; Fanbase — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="brand-logo">
      <img src="logo.png" onerror="this.style.display='none'" alt="Logo" class="logo-icon">
      <h1>&lt;TER&gt;</h1>
    </a>
    <nav>
      <a href="index.html" class="active">Login</a>
      <a href="cadastro.html">Cadastrar</a>
      <a href="https://www.tiktok.com/@kailtern?_r=1&_t=ZS-9BLgYPKRw1Q" target="_blank" rel="noopener noreferrer">TikTok Oficial</a>
    </nav>
  </header>

  <div class="container">
    <div class="card" style="max-width: 430px; margin: 3.5rem auto;">
      <h2>Entrar no Fã-Clube</h2>
      <p class="form-subtitle">Acesse o portal dedicado ao universo do <strong>Kailtern</strong>.</p>

      <form id="loginForm">
        <div class="form-group" style="margin-bottom: 1.2rem;">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="seu@email.com" autocomplete="email">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" style="width: 100%;">Acessar Portal</button>
      </form>

      <a href="cadastro.html" class="link-redirect">Ainda não faz parte da fanbase? Cadastre-se</a>
    </div>
  </div>

  <footer>
    <p>&lt;ter&gt; Fanbase • Feito pela fã nº 1 do <strong>Kailtern</strong></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
